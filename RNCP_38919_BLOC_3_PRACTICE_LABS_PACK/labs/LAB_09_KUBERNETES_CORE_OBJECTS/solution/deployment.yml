apiVersion: apps/v1
kind: Deployment
metadata:
  name: parcelpulse-api
  namespace: parcelpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parcelpulse-api
  template:
    metadata:
      labels:
        app: parcelpulse-api
    spec:
      containers:
        - name: api
          image: USER/parcelpulse-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: parcelpulse-config
          volumeMounts:
            - name: model-storage
              mountPath: /models
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: parcelpulse-pvc
