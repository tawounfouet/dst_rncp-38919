stages:
  - test
  - build

tests:
  stage: test
  image: python:3.12-slim
  script:
    - python --version
    - pip install --no-cache-dir -r requirements.txt
    - pytest -v

docker_build:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -t parcelpulse-api:latest .

