apiVersion: apps/v1
kind: Deployment
metadata:
  name: parcelpulse-api
  namespace: parcelpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parcelpulse-api
  template:
    metadata:
      labels:
        app: parcelpulse-api
    spec:
      initContainers:
        - name: init-model-artifact
          image: tawounfouet/parcelpulse-api:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - "if [ ! -f /models/model.joblib ]; then cp /app/models/model.joblib /models/model.joblib; fi"
          volumeMounts:
            - name: model-storage
              mountPath: /models
      containers:
        - name: api
          # Image publiee sur DockerHub par le job CI 'docker_push' (pipeline GitLab).
          #
          # Pourquoi une reference de registre et pas 'parcelpulse-api:latest' ?
          # Docker et containerd (le runtime de Kubernetes) ont DEUX magasins
          # d'images separes : une image construite par 'docker build' sur la
          # machine est INVISIBLE du cluster, et le pod tombe en ErrImageNeverPull.
          # En Designant l'image par son nom de registre, un seul manifest sert
          # aux deux cas :
          #   - kind / minikube  -> l'image est chargee localement (kind load), donc
          #                         IfNotPresent ne tente aucun pull ;
          #   - MicroK8s / AWS   -> containerd tire l'image publique sur DockerHub.
          #
          # Pour un deploiement 100% hors-ligne, remplacer par un nom local
          # (ex. parcelpulse-api:latest) et importer l'image dans containerd :
          #     docker save parcelpulse-api:latest | sudo microk8s ctr images import -
          # puis aligner imagePullPolicy sur Never.
          image: tawounfouet/parcelpulse-api:latest
          # IfNotPresent = ne pas re-telecharger si l'image est deja sur le nœud.
          # Sur un tag mutable (:latest), un redeploiement ne re-tire donc pas la
          # version fraiche : utiliser 'deploy_k8s.sh --refresh' pour forcer.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: parcelpulse-config
          volumeMounts:
            - name: model-storage
              mountPath: /models
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: parcelpulse-pvc
